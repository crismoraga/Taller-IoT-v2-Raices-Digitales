services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      # Trust only our Caddy peer, never arbitrary forwarded headers from clients.
      TRUST_PROXY: ${CADDY_PROXY_IP:-172.30.44.2}/32
      APP_ORIGIN: ${APP_ORIGIN:-https://${DOMAIN:?Configura DOMAIN}}
      DATABASE_PATH: /app/data/raices.sqlite
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:?Configura TEACHER_PASSWORD}
      SECRETS_KEY: ${SECRETS_KEY:?Configura SECRETS_KEY}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      DEVICE_OFFLINE_SECONDS: ${DEVICE_OFFLINE_SECONDS:-120}
      DEVICE_AUDIT_SECONDS: ${DEVICE_AUDIT_SECONDS:-20}
      ARDUINO_SERVICE_URL: http://compiler:3002
      ARDUINO_SERVICE_TOKEN: ${ARDUINO_SERVICE_TOKEN:?Configura ARDUINO_SERVICE_TOKEN}
    volumes:
      - raices_data:/app/data
    networks:
      private: {}
      proxy:
        ipv4_address: ${APP_PROXY_IP:-172.30.44.3}
      egress: {}
    depends_on:
      compiler:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  compiler:
    build:
      context: .
      dockerfile: Dockerfile.compiler
    restart: unless-stopped
    environment:
      ARDUINO_SERVICE_TOKEN: ${ARDUINO_SERVICE_TOKEN:?Configura ARDUINO_SERVICE_TOKEN}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/health',{headers:{authorization:'Bearer '+process.env.ARDUINO_SERVICE_TOKEN},signal:AbortSignal.timeout(6000)}).then(async r=>process.exit(r.ok&&(await r.json()).ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 8s
      start_period: 20s
      retries: 3
    networks: [private]
    read_only: true
    tmpfs: [/tmp:size=256m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Configura DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Configura ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy:
        ipv4_address: ${CADDY_PROXY_IP:-172.30.44.2}
      egress: {}
    depends_on:
      app:
        condition: service_healthy
networks:
  private:
    internal: true
  proxy:
    internal: true
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.44.0/29}
  egress: {}
volumes:
  raices_data: {}
  caddy_data: {}
  caddy_config: {}
