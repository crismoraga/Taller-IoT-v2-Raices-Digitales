name: Validate workshop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node scripts/init-local.mjs
      - run: npm run check
      - run: npx playwright install --with-deps chrome
      - name: Start application and validate API
        shell: bash
        run: |
          npm run dev > "$RUNNER_TEMP/raices-dev.log" 2>&1 &
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health > /dev/null && curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/raices-dev.log"
            exit 1
          fi
          node scripts/smoke-deployment.mjs http://127.0.0.1:3001 --allow-http --exercise-session
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build production application
        run: docker build --tag raices-app:ci .
      - name: Build verified Arduino toolchain
        run: docker build --file Dockerfile.compiler --tag raices-compiler:ci .
      - name: Compile station inside isolated production compiler
        shell: bash
        run: |
          docker run --detach --name rd-compiler-ci --read-only --network none --cap-drop ALL --security-opt no-new-privileges --memory 768m --cpus 1.5 --pids-limit 128 --tmpfs /tmp:size=256m,mode=1777 --env ARDUINO_SERVICE_TOKEN=ci-only-compiler-isolation-validation-token raices-compiler:ci
          ready=false
          for attempt in {1..20}; do
            if docker exec rd-compiler-ci node -e "fetch('http://127.0.0.1:3002/health',{headers:{authorization:'Bearer '+process.env.ARDUINO_SERVICE_TOKEN}}).then(async r=>process.exit(r.ok&&(await r.json()).ok?0:1)).catch(()=>process.exit(1))"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs rd-compiler-ci
            exit 1
          fi
          python3 - "$RUNNER_TEMP/Station.ino" <<'PY'
          import sys
          from pathlib import Path
          flags = ['SOIL', 'LIGHT', 'WATER', 'RAIN', 'PIR', 'DS', 'DISTANCE', 'DHT', 'AIR_TEMP', 'AIR_HUMIDITY']
          constants = [f'const bool ENABLE_{name} = true;' for name in flags]
          for sensor in ['SOIL', 'LIGHT', 'WATER']:
              constants.extend([f'const int {sensor}_DRY = 850;', f'const int {sensor}_WET = 350;'])
          Path(sys.argv[1]).write_text('\n'.join(constants) + '\n\n' + Path('firmware/arduino/station.ino').read_text())
          PY
          docker exec -i rd-compiler-ci node -e "const code=require('fs').readFileSync(0,'utf8'); fetch('http://127.0.0.1:3002/compile',{method:'POST',headers:{authorization:'Bearer '+process.env.ARDUINO_SERVICE_TOKEN,'content-type':'application/json'},body:JSON.stringify({code,board:'uno'}),signal:AbortSignal.timeout(65000)}).then(async r=>{const result=await r.json();if(!r.ok||!result.hex?.startsWith(':')){console.error(result.error||'No Intel HEX');process.exit(1)}console.log('Real station compiled successfully inside isolated compiler.')}).catch(e=>{console.error(e.message);process.exit(1)})" < "$RUNNER_TEMP/Station.ino"
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs rd-compiler-ci 2>/dev/null || true
          docker rm --force rd-compiler-ci 2>/dev/null || true
